name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # CI uses a local SQLite file; the runtime checks against libsql.
      TURSO_URL: file:./.ci.db
      TURSO_TOKEN: ""
      AUTH_SECRET: ci-secret-not-used-for-real-auth-placeholder-32chars
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npm run migrate

      - name: Build
        run: npm run build

      - name: Upload .next build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
          retention-days: 3
          if-no-files-found: ignore

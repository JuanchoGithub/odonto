name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project config (vercel.json + project id)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Deployed: $url"

      - name: Smoke test production
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "Smoke testing $url"
          for path in / /es/login /en/login; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L "$url$path")
            echo "  $path -> $code"
            if [ "$code" != "200" ] && [ "$code" != "307" ] && [ "$code" != "404" ]; then
              echo "Unexpected status $code on $path"
              exit 1
            fi
          done
